[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-auth-tester"
version = "0.1.0"
description = "Policy-driven testing of authorization after permission changes"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.12.5",
    "PyYAML==6.0.3",
    "typer==0.24.1",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
lab = ["fastapi==0.123.4", "uvicorn==0.38.0"]
web = ["fastapi==0.123.4", "uvicorn==0.38.0", "Jinja2==3.1.6"]
monitoring = ["prometheus-client==0.23.1"]
ui-test = ["playwright==1.64.1"]

[project.scripts]
temporal-auth = "temporal_auth.cli:app"

[tool.setuptools.packages.find]
where = ["src", "targets"]
namespaces = false

[tool.setuptools.package-data]
"temporal_auth.web" = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "targets"]
addopts = "--strict-markers"
markers = ["network: starts temporary HTTP servers on loopback"]
